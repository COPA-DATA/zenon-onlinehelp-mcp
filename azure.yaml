# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: zenon-docs-mcp
metadata:
    template: azd-init@1.34.0
services:
    zenon-docs-mcp:
        project: .
        host: containerapp
        language: ts
        docker:
            path: Dockerfile
            context: .
            remoteBuild: true
    copatools-docs-mcp:
        project: .
        host: containerapp
        language: ts
        docker:
            path: Dockerfile
            context: .
            remoteBuild: true
resources:
    zenon-docs-mcp:
        type: host.containerapp
        port: 3000
    copatools-docs-mcp:
        type: host.containerapp
        port: 3000
